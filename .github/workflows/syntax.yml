name: Example syntax
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q python/examples scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Check TypeScript syntax without importing SDK packages
        run: |
          for example in typescript/examples/*.ts; do
            node --experimental-strip-types --check "$example"
          done
